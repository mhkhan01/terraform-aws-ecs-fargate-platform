name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: fmt / validate / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: validate and test examples
        run: |
          for d in examples/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            terraform -chdir="$d" test
            echo "::endgroup::"
          done

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1

      - name: tflint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        run: tflint --recursive --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned so new upstream checks cannot turn the badge red without a code change.
      - run: pip install checkov==3.3.29
      - run: checkov -d . --config-file .checkov.yaml --quiet --compact
